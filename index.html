<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f9f5ed"><title>我不舒服！</title><link rel="stylesheet" href="styles.css?v=19"></head><body>
<div id="inviteGate" class="invite-gate" hidden><form id="inviteForm" class="invite-card"><div class="invite-mark">🌱</div><small>PRIVATE GARDEN</small><h1>欢迎来到《我不舒服！》</h1><p>输入你的邀请码，回到属于自己的小花园。</p><label>邀请码<input id="inviteCode" autocomplete="off" maxlength="12" placeholder="5—12位字母或数字"></label><output id="inviteError"></output><button class="primary" type="submit">登入</button><button class="invite-generate" type="button" id="generateInviteOpen">生成邀请码</button></form></div>
<div id="shell"><header class="topbar"><button class="wordmark" data-view="reflect"><span>我不舒服！</span></button><button id="modelButton" class="model-button">连接模型</button></header><main id="app"></main><nav class="tabbar" aria-label="主导航"><button data-view="reflect"><span>▤</span>复盘</button><button data-view="garden"><span>♧</span>花园</button><button data-view="profile"><span>▦</span>我的</button></nav></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="generateInviteDialog"><form method="dialog" id="generateInviteForm"><div class="dialog-head"><div><small>INVITATION ACCESS</small><h2>生成邀请码</h2></div><button type="button" id="generateInviteClose">×</button></div><p>为一位体验者创建独立的数据空间。邀请码生效后可在不同设备登入。</p><label>新邀请码<input name="inviteCode" maxlength="12" autocomplete="off" placeholder="例如 AAAAA" required></label><label>管理员密码<input name="adminPassword" type="password" autocomplete="off" required></label><output id="generateInviteStatus"></output><div class="dialog-actions"><button type="button" class="quiet" id="generateInviteCancel">取消</button><button type="submit" class="primary">生成</button></div></form></dialog>
<dialog id="modelDialog"><form method="dialog" id="modelForm"><div class="dialog-head"><div><small>MODEL CONNECTION</small><h2>连接模型服务</h2></div><button type="button" id="modelClose" aria-label="关闭">×</button></div><p>默认体验模型由项目提供。你也可以添加自己的服务商；地址、模型名和 Key 只保存在当前浏览器。</p><div id="providerList" class="provider-list"></div><label>服务商名称<input name="providerName" maxlength="20" placeholder="例如 我的 DeepSeek" required></label><input name="providerId" type="hidden"><label>API 地址<input name="api" type="url" placeholder="https://服务商域名/v1" required></label><label>模型名称<input name="model" placeholder="例如 deepseek-chat" required></label><label>API Key<input name="key" type="password" placeholder="sk-…" required></label><output id="modelStatus"></output><div class="dialog-actions"><button type="button" class="quiet danger" id="clearModel">使用默认模型</button><button type="submit" class="primary">保存配置</button></div></form></dialog>
<dialog id="recordDialog"><div id="recordModal"></div></dialog>
<dialog id="profileDialog"><form method="dialog" id="profileForm"><div class="dialog-head"><div><small>PROFILE CARD</small><h2>编辑个人名片</h2></div><button type="button" id="profileClose">×</button></div><label>名字<input name="name" maxlength="16"></label><label>想被怎样称呼<input name="call" maxlength="18"></label><label>介绍自己<textarea name="intro" maxlength="80"></textarea></label><label>给自己的话<textarea name="note" maxlength="60"></textarea></label><div class="dialog-actions"><button type="button" id="profileCancel" class="quiet">取消</button><button value="save" class="primary">保存</button></div></form></dialog>
<script src="assets.js?v=1"></script><script src="cloud-api.js?v=1"></script><script src="browser-model.js?v=26"></script><script src="app.js?v=24"></script></body></html>
